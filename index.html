<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vertical Math Facts Table – Operations & Pages</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="controls">
  <div class="control-section">
    <label for="pageCount">Pages (each page = 10 rows):</label>
    <input type="number" id="pageCount" value="1" min="1">
  </div>
  
  <div class="control-section">
    <label for="fontSize">Font size:</label>
    <select id="fontSize">
      <option value="12">Small (12px)</option>
      <option value="16" selected>Medium (16px)</option>
      <option value="20">Large (20px)</option>
      <option value="24">Extra Large (24px)</option>
    </select>
  </div>
  
  <fieldset class="baseNumberSelection">
    <legend>Select base numbers to practice:</legend>
    <div class="select-all-section">
      <label><input type="checkbox" id="selectAllBaseNumbers"> Select All</label>
    </div>
    <label><input type="checkbox" name="baseNumbers" value="1"> 1s</label>
    <label><input type="checkbox" name="baseNumbers" value="2"> 2s</label>
    <label><input type="checkbox" name="baseNumbers" value="3"> 3s</label>
    <label><input type="checkbox" name="baseNumbers" value="4" checked> 4s</label>
    <label><input type="checkbox" name="baseNumbers" value="5"> 5s</label>
    <label><input type="checkbox" name="baseNumbers" value="6"> 6s</label>
    <label><input type="checkbox" name="baseNumbers" value="7"> 7s</label>
    <label><input type="checkbox" name="baseNumbers" value="8"> 8s</label>
    <label><input type="checkbox" name="baseNumbers" value="9"> 9s</label>
    <label><input type="checkbox" name="baseNumbers" value="10"> 10s</label>
    <label><input type="checkbox" name="baseNumbers" value="11"> 11s</label>
    <label><input type="checkbox" name="baseNumbers" value="12"> 12s</label>
  </fieldset>
  
  <fieldset class="operatorSelection">
    <legend>Select operations:</legend>
    <label><input type="checkbox" name="operators" value="addition" checked> Addition (+)</label>
    <label><input type="checkbox" name="operators" value="subtraction" checked> Subtraction (−)</label>
    <label><input type="checkbox" name="operators" value="multiplication" checked> Multiplication (×)</label>
    <label><input type="checkbox" name="operators" value="division" checked> Division (÷)</label>
  </fieldset>
  
  <div class="control-section">
    <label>
      <input type="checkbox" id="hardProblemsOnly"> Hard problems only (excludes 0s, 1s, 2s, 5s, 10s)
    </label>
  </div>
  
  <div class="control-section">
    <label>
      <input type="checkbox" id="noRepeatProblems"> No repeat problems (every problem is unique)
    </label>
  </div>
  
  <div class="control-section">
    <label>
      <input type="checkbox" id="doubleDigitOperands"> Include double digit operands (10-99)
    </label>
  </div>
  
  <div class="button-section">
    <button id="submitButton">Generate Worksheet</button>
    <button id="pdfButton" type="button">Download PDF</button>
  </div>
</div>

<div id="mathTableBody">
  <!-- The math problems pages will be built here -->
</div>

<script src="script.js"></script>
</body>
</html>
